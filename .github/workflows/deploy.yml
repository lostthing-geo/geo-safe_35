name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  cleanup:
    name: Cleanup old deployments
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Delete old inactive deployments
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          deployments=$(gh api \
            "repos/$GH_REPO/deployments?environment=github-pages&per_page=100")

          # Das neueste Deployment behalten
          keep_id=$(echo "$deployments" | jq -r '.[0].id // empty')

          if [ -z "$keep_id" ]; then
            echo "Keine Deployments gefunden."
            exit 0
          fi

          echo "Behalte Deployment $keep_id"

          echo "$deployments" | jq -r '.[].id' |
          while read -r id; do
            # Aktuellstes Deployment niemals löschen
            [ "$id" = "$keep_id" ] && continue

            state=$(gh api \
              "repos/$GH_REPO/deployments/$id/statuses" \
              --jq '.[0].state // "unknown"')

            if [ "$state" = "inactive" ]; then
              echo "Lösche altes inaktives Deployment $id"

              gh api --method DELETE \
                "repos/$GH_REPO/deployments/$id"
            else
              echo "Überspringe Deployment $id (Status: $state)"
            fi
          done